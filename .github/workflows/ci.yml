name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Seed file is up to date
        run: npm run seed:generate && git diff --exit-code supabase/seed.sql
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  database:
    name: Migrations, RLS tests and end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0 # the version in package-lock.json; "latest" changed db diff's flags
      - name: Start Supabase and apply migrations + seed
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Migration check (no drift between migrations and schema)
        # db diff has no exit-code flag: fail when its output contains any schema change.
        run: |
          out=$(supabase db diff --local --schema public 2>/dev/null)
          if echo "$out" | grep -qiE '^\s*(create|alter|drop|grant|revoke|comment on) |"diff":"[^"]'; then
            echo "Schema drift detected:"; echo "$out"; exit 1
          fi
      - name: RLS tests
        run: npm run db:test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Every migration reverses and re-applies (item 55)
        run: npm run db:rollback-test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Query-count (N+1) and end-to-end tests
        env:
          # Local-only values for the test run; production secrets never reach CI.
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          PAYSTACK_MODE: mock
          CRON_SECRET: ci-cron-secret-0123456789abcdef
          METRICS_SALT: ci-metrics-salt-0123456789
          RESEND_WEBHOOK_SECRET: whsec_Y2ktd2ViaG9vay1zZWNyZXQtMDEyMzQ1Njc4OWFiY2RlZg==
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npx vitest run tests/unit/n-plus-one.test.ts
          npx playwright install --with-deps chromium
          npm run build && npm run test:e2e
